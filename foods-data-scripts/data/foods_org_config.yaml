# ─────────────────────────────────────────────────────────────
# HEAT MAP DIMENSIONS (scoring config)
# ─────────────────────────────────────────────────────────────
heat_map:
  dimensions:
    - id: "delivery"
      name: "Delivery Health"
      description: "Sprint velocity, burndown, created vs resolved, blocked items"
      sources: ["jira"]
      thresholds:
        green: 80   # score >= 80
        amber: 50   # score >= 50
        red: 0      # score < 50

    - id: "system-health"
      name: "System Health"
      description: "Dynatrace service availability, error rates, response times"
      sources: ["dynatrace", "azure"]
      thresholds:
        green: 90
        amber: 70
        red: 0

    - id: "incidents"
      name: "Incidents & Alerts"
      description: "PagerDuty incidents, ITSM tickets, severity distribution"
      sources: ["pagerduty", "itsm"]
      thresholds:
        green: 90
        amber: 60
        red: 0

    - id: "code-quality"
      name: "Code & Repo Quality"
      description: "PR health, stale branches, test coverage, security findings"
      sources: ["github", "ghas"]
      thresholds:
        green: 80
        amber: 50
        red: 0

    - id: "estate-hygiene"
      name: "Estate Hygiene"
      description: "Tech stack currency, dependency drift, catalog completeness"
      sources: ["github", "techstack"]
      thresholds:
        green: 85
        amber: 60
        red: 0

    - id: "operational-readiness"
      name: "Operational Readiness"
      description: "PagerDuty standards, on-call coverage, runbooks, escalation policies"
      sources: ["pagerduty"]
      thresholds:
        green: 80
        amber: 50
        red: 0

    - id: "people-capacity"
      name: "People & Capacity"
      description: "Vacancies, team size, supplier mix, key person risk"
      sources: ["manual"]
      thresholds:
        green: 80
        amber: 50
        red: 0
