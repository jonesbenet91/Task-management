
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/taskmanagement


jobs:


  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'     # Eclipse Temurin = free, production-ready JDK
          cache: 'maven'              # Cache downloaded Maven dependencies for speed

  
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

     
      #
      # -B = batch mode (no interactive prompts, cleaner logs)
      # -Dspring.profiles.active=test ensures test config is used
      - name: Build and run tests with coverage
        run: mvn verify -B -Dspring.profiles.active=test

      - name: Run lint check (Checkstyle)
        run: mvn checkstyle:check -B


      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/   # JaCoCo generates reports here
          retention-days: 30          # Keep the artifact for 30 days

      # -----------------------------------------------------------------------
      # STEP 6: UPLOAD TEST RESULTS
      # -----------------------------------------------------------------------
      # Surefire generates XML test result files. Uploading them lets you
      # see exactly which tests passed/failed in the GitHub Actions UI.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 30


      - name: Upload build artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 30

 
  docker-package:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test              # Must pass before Docker build
    if: github.event_name == 'push'    # Only build image on push, not on PR
    outputs:
      version_tag: ${{ steps.version.outputs.VERSION_TAG }}
      image_ref: ${{ steps.version.outputs.IMAGE_REF }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Build the JAR first (Docker needs it)
      - name: Build application JAR
        run: mvn package -B -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION_TAG="1.0.0-${SHORT_SHA}-build-${{ github.run_number }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION_TAG}"
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE_REF=${IMAGE_REF}" >> $GITHUB_OUTPUT
          echo "Docker image will be tagged as: ${VERSION_TAG}"

      - name: Preserve previous latest tag for rollback
        if: github.ref == 'refs/heads/main'
        run: |
          PREVIOUS_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:previous"
          LATEST_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          if docker pull "${LATEST_IMAGE}"; then
            docker tag "${LATEST_IMAGE}" "${PREVIOUS_IMAGE}"
            docker push "${PREVIOUS_IMAGE}"
            echo "Saved ${LATEST_IMAGE} as ${PREVIOUS_IMAGE} for rollback"
          else
            echo "No latest image found yet. Skipping previous tag creation."
          fi

    
      - name: Build Docker image
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker build \
            -t "${IMAGE_BASE}:${{ steps.version.outputs.VERSION_TAG }}" \
            -t "${IMAGE_BASE}:${{ github.ref_name }}" \
            -f Dockerfile .
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "${IMAGE_BASE}:${{ steps.version.outputs.VERSION_TAG }}" "${IMAGE_BASE}:latest"
          fi

      - name: Push Docker image tags
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker push "${IMAGE_BASE}:${{ steps.version.outputs.VERSION_TAG }}"
          docker push "${IMAGE_BASE}:${{ github.ref_name }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push "${IMAGE_BASE}:latest"
          fi

      - name: Verify Docker image
        run: |
          echo "=== Built Docker Images ==="
          docker images "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo ""
          echo "=== Image Size ==="
          docker images "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" --format "{{.Repository}}:{{.Tag}} - {{.Size}}"

      - name: Save image metadata artifact
        run: |
          mkdir -p build-artifacts
          {
            echo "image=${{ steps.version.outputs.IMAGE_REF }}"
            echo "version_tag=${{ steps.version.outputs.VERSION_TAG }}"
            echo "branch=${{ github.ref_name }}"
            echo "commit=${{ github.sha }}"
            echo "run_number=${{ github.run_number }}"
          } > build-artifacts/image-metadata.txt

      - name: Upload image metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-metadata
          path: build-artifacts/image-metadata.txt
          retention-days: 30

  deploy-main:
    name: Deploy Main Image
    runs-on: ubuntu-latest
    needs: docker-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy container and replace existing instance
        env:
          IMAGE_REF: ${{ needs.docker-package.outputs.image_ref }}
          CONTAINER_NAME: taskmanagement-app
          HOST_PORT: "8082"
          CONTAINER_PORT: "8082"
          SERVER_PORT: "8082"
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:h2:mem:taskmanagement;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: ci-cd-deployment-secret-key
          JWT_EXPIRATION: "86400000"
        run: |
          chmod +x scripts/deploy-local.sh
          ./scripts/deploy-local.sh

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-log
          path: deployment-logs/*.log
          retention-days: 30
