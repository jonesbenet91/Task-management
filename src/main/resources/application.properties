spring.application.name=taskmanagement
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8082}

# PostgreSQL Configuration
# Values come from environment variables; defaults are for local dev only.
# In Docker/production, these are set via docker-compose.yml or -e flags.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanagement}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
# NEVER hardcode secrets — always use environment variables
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator — expose health endpoint for Docker health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always